<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cardápio Musical — Peça Sua Música</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style id="own">
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#FAF7F2;color:#1C1917}
.serif{font-family:'Playfair Display',Georgia,serif}
.cifra{font-family:'Courier New',monospace;white-space:pre-wrap;line-height:1.55}
@media print{body *{visibility:hidden}#poster-print-area,#poster-print-area *{visibility:visible}#poster-print-area{position:fixed;left:0;top:0;width:100%}}
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-[#1C1917] text-white shadow-md">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0"><span class="text-amber-400 text-xl">♪</span><span id="header-name" class="font-semibold truncate text-sm"></span></div>
    <div id="tabs" class="hidden flex bg-stone-800 p-1 rounded-xl shrink-0">
      <button id="t-pub" onclick="switchMode('public')" class="px-3 py-1.5 rounded-lg text-xs font-medium">Público</button>
      <button id="t-adm" onclick="switchMode('admin')" class="px-3 py-1.5 rounded-lg text-xs font-medium">Painel Músico</button>
    </div>
  </div>
</header>

<!-- PÚBLICO -->
<main id="view-public" class="flex-1 max-w-4xl w-full mx-auto px-4 pb-16">
  <section class="relative mt-4 rounded-3xl overflow-hidden bg-white shadow-sm border border-stone-200">
    <div class="h-36 sm:h-48 w-full bg-gradient-to-r from-stone-800 via-amber-900 to-stone-900 overflow-hidden">
      <img id="pub-cover" alt="" class="hidden w-full h-full object-cover opacity-80" />
    </div>
    <div class="px-5 pb-6 flex flex-col items-center gap-3 -mt-14 relative z-10 text-center">
      <div class="w-28 h-28 rounded-t-full rounded-b-2xl border-4 border-white shadow-lg overflow-hidden bg-white shrink-0 flex items-center justify-center">
        <img id="pub-avatar" alt="" class="hidden w-full h-full object-cover object-top" /><span id="pub-avatar-ph" class="text-4xl">🎸</span>
      </div>
      <div class="w-full min-w-0 flex flex-col items-center">
        <img id="pub-logo" alt="João Paulo — Voz e violão e sanfona" class="hidden w-full max-w-[320px] h-auto mb-1" />
        <h1 id="pub-title" class="serif text-2xl sm:text-3xl font-bold leading-tight"></h1>
        <p id="pub-sub" class="text-stone-600 text-sm mt-0.5"></p>
        <div class="mt-2 flex flex-wrap items-center justify-center gap-2">
          <span class="bg-amber-100 text-amber-900 text-xs font-semibold px-3 py-1 rounded-full">Contribuição mínima: <strong id="pub-min"></strong></span>
          <span id="pub-insta" class="text-xs text-stone-500 font-medium"></span>
        </div>
      </div>
    </div>
  </section>
  <section class="mt-6 space-y-3">
    <input id="search" oninput="renderPublic()" placeholder="Buscar música ou artista..." class="w-full px-4 py-3 rounded-2xl bg-white border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
    <div id="genres" class="flex gap-2 overflow-x-auto pb-1"></div>
  </section>
  <section id="pub-list" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3"></section>
</main>

<!-- ADMIN -->
<main id="view-admin" class="hidden flex-1 max-w-4xl w-full mx-auto px-4 py-6 pb-24">
  <div class="flex gap-2 border-b border-stone-200 pb-3 mb-6">
    <button id="st-songs" onclick="subtab('songs')" class="px-4 py-2 rounded-xl text-sm font-semibold">Repertório & Cifras</button>
    <button id="st-set" onclick="subtab('set')" class="px-4 py-2 rounded-xl text-sm font-semibold">Imagens & Pix</button>
  </div>

  <section id="ad-songs" class="space-y-4">
    <div class="flex items-center justify-between gap-2">
      <h2 class="text-lg font-bold">Repertório</h2>
      <button onclick="openEditor()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-amber-500 text-stone-950">+ Nova Música</button>
    </div>
    <div id="editor" class="hidden bg-white p-5 rounded-2xl border border-stone-300 space-y-3">
      <h3 id="editor-title" class="font-bold">Música</h3>
      <input type="hidden" id="e-id" />
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="block text-xs font-semibold text-stone-600 mb-1">Nome *</label><input id="e-title" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
        <div><label class="block text-xs font-semibold text-stone-600 mb-1">Artista *</label><input id="e-artist" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
        <div><label class="block text-xs font-semibold text-stone-600 mb-1">Gênero</label><input id="e-genre" placeholder="Forró, Sertanejo, MPB" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
        <div><label class="block text-xs font-semibold text-stone-600 mb-1">Tom</label><input id="e-key" placeholder="G, Am, D" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      </div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Letra e Cifra (só você vê)</label><textarea id="e-chords" rows="7" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-mono"></textarea></div>
      <div class="flex justify-end gap-2">
        <button onclick="$('editor').classList.add('hidden')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-stone-200">Cancelar</button>
        <button onclick="saveSong()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white">Salvar Música</button>
      </div>
    </div>
    <input id="ad-search" oninput="alim=60;renderAdmin()" placeholder="Buscar para editar..." class="w-full px-4 py-2.5 rounded-xl bg-white border border-stone-300 text-sm" />
    <div id="ad-list" class="space-y-2"></div>
  </section>

  <section id="ad-set" class="hidden bg-white p-5 rounded-2xl border border-stone-200 space-y-4">
    <h2 class="text-lg font-bold">Perfil, Fotos e Pix</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="p-4 border border-dashed border-stone-300 rounded-2xl text-center space-y-2">
        <p class="text-xs font-semibold">Foto de Perfil</p>
        <img id="pv-avatar" class="hidden w-20 h-20 object-cover rounded-full mx-auto border" />
        <label class="relative inline-block overflow-hidden px-3 py-2 rounded-xl bg-amber-100 text-amber-900 text-xs font-semibold cursor-pointer">Escolher foto<input type="file" accept="image/*" onchange="upImg(event,'avatar')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" /></label>
        <button onclick="rmImg('avatar')" class="block mx-auto text-[11px] text-stone-400">Remover</button>
      </div>
      <div class="p-4 border border-dashed border-stone-300 rounded-2xl text-center space-y-2">
        <p class="text-xs font-semibold">Capa (Banner)</p>
        <img id="pv-cover" class="hidden w-full h-20 object-cover rounded-xl border" />
        <label class="relative inline-block overflow-hidden px-3 py-2 rounded-xl bg-amber-100 text-amber-900 text-xs font-semibold cursor-pointer">Escolher capa<input type="file" accept="image/*" onchange="upImg(event,'cover')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" /></label>
        <button onclick="rmImg('cover')" class="block mx-auto text-[11px] text-stone-400">Remover</button>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Nome Artístico</label><input id="c-name" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Subtítulo</label><input id="c-sub" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">@Instagram</label><input id="c-insta" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Valor mínimo do Pix (R$)</label><input id="c-min" type="number" step="0.5" min="1" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      <div class="sm:col-span-2"><label class="block text-xs font-semibold text-stone-600 mb-1">WhatsApp para receber pedidos (com DDD, só números)</label><input id="c-wa" placeholder="74999999999" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
    </div>
    <hr class="border-stone-200" />
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Chave Pix *</label><input id="c-key" placeholder="CPF, e-mail, +55... ou aleatória" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Nome do titular</label><input id="c-pname" maxlength="25" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Cidade</label><input id="c-city" maxlength="15" class="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm" /></div>
    </div>
    <button onclick="openPoster()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-stone-800 text-white">Gerar Cartaz QR Code</button>
  </section>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-300 p-3 flex items-center justify-between gap-3" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))">
    <span id="dirty-msg" class="text-xs text-stone-500">Sem alterações pendentes</span>
    <button onclick="publishNow()" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-emerald-600 text-white">Publicar alterações</button>
  </div>
</main>

<!-- MODAL PEDIDO -->
<div id="modal-order" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-start justify-between gap-2">
      <div><span class="text-xs font-semibold uppercase tracking-wider text-amber-700">Pedir Música</span><h3 id="m-title" class="text-xl font-bold"></h3><p id="m-artist" class="text-xs text-stone-500"></p></div>
      <button onclick="$('modal-order').classList.add('hidden')" class="text-stone-400 text-xl font-bold px-2">×</button>
    </div>
    <div id="step-form" class="space-y-3">
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Seu Nome *</label><input id="o-name" placeholder="Como o cantor vai te chamar?" class="w-full px-3 py-2.5 rounded-xl border border-stone-300 text-sm" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Valor do Pix (R$) *</label><div id="quick" class="flex gap-2 mb-2"></div><input id="o-amount" type="number" class="w-full px-3 py-2.5 rounded-xl border border-stone-300 text-sm font-bold" /></div>
      <div><label class="block text-xs font-semibold text-stone-600 mb-1">Recado (opcional)</label><input id="o-note" placeholder="Ex.: Ofereço para a mesa 4!" class="w-full px-3 py-2.5 rounded-xl border border-stone-300 text-sm" /></div>
      <button onclick="genPix()" class="w-full py-3 rounded-2xl bg-amber-500 text-stone-950 font-bold text-sm">Gerar QR Code Pix</button>
    </div>
    <div id="step-pix" class="hidden space-y-4 text-center">
      <div class="bg-stone-50 p-4 rounded-2xl border border-stone-200 flex flex-col items-center">
        <div id="pix-qr" class="bg-white p-3 rounded-xl"></div>
        <p class="text-xs text-stone-500 mt-2">Escaneie no app do seu banco</p>
        <p id="pix-amt" class="text-lg font-bold text-emerald-700 mt-1"></p>
      </div>
      <div class="text-left"><label class="block text-xs font-semibold text-stone-600 mb-1">Pix Copia e Cola</label>
        <div class="flex gap-2"><input id="pix-code" readonly class="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs bg-stone-50 font-mono" /><button onclick="copyPix()" class="px-3 py-2 rounded-xl bg-stone-800 text-white text-xs font-semibold shrink-0">Copiar</button></div></div>
      <button onclick="sendOrder()" class="w-full py-3 rounded-2xl bg-emerald-600 text-white font-bold text-sm">Já fiz o Pix — Avisar o Músico</button>
      <p id="send-hint" class="text-xs text-stone-500"></p>
    </div>
  </div>
</div>

<!-- MODAL CIFRA -->
<div id="modal-chords" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-xl flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between border-b border-stone-200 pb-3">
      <div><h3 id="ch-title" class="text-lg font-bold"></h3><p id="ch-meta" class="text-xs text-stone-500"></p></div>
      <div class="flex items-center gap-2">
        <button onclick="fontSz(-2)" class="px-2.5 py-1 rounded-lg bg-stone-200 text-xs font-bold">A-</button>
        <button onclick="fontSz(2)" class="px-2.5 py-1 rounded-lg bg-stone-200 text-xs font-bold">A+</button>
        <button onclick="$('modal-chords').classList.add('hidden')" class="text-stone-500 text-2xl font-bold px-2">×</button>
      </div>
    </div>
    <div id="ch-body" class="cifra overflow-y-auto pt-4 text-sm flex-1"></div>
  </div>
</div>

<!-- MODAL CARTAZ -->
<div id="modal-poster" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-xl space-y-4 max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between items-center"><span class="text-sm font-bold">Cartaz para Impressão</span><button onclick="$('modal-poster').classList.add('hidden')" class="text-xl font-bold text-stone-500">×</button></div>
    <div id="poster-print-area" class="bg-[#FAF7F2] border border-stone-300 rounded-2xl p-6 text-center space-y-4">
      <div class="w-28 h-32 mx-auto rounded-t-full border-2 border-amber-700/40 overflow-hidden bg-stone-200 flex items-center justify-center"><img id="po-avatar" class="hidden w-full h-full object-cover" /><span id="po-ph" class="text-4xl">🎶</span></div>
      <div><h3 id="po-name" class="serif text-2xl font-bold"></h3><p class="serif italic text-xl text-amber-800 mt-1">Peça sua música</p><p class="text-xs text-stone-600 mt-1">Aponte a câmera para o QR Code</p></div>
      <div id="po-qr" class="bg-white p-3 rounded-2xl inline-block border border-stone-200"></div>
      <p id="po-foot" class="text-xs text-stone-500 font-medium"></p>
    </div>
    <button onclick="window.print()" class="w-full py-3 rounded-2xl bg-stone-900 text-white font-semibold text-sm">Imprimir</button>
  </div>

<script id="app">
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lim=80,lastKey='',alim=60;let S=JSON.parse($('state').textContent),dirty=false,genre='Todos',cur=null,fs=14,order=null;
const money=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
const BTN='px-3 py-1.5 rounded-lg text-xs font-medium ';
const ON='bg-amber-500 text-stone-950',OFF='text-stone-300';

function setDirty(){dirty=true;$('dirty-msg').textContent='Alterações não publicadas';}
function applyProfile(){
  const p=S.p;
  $('header-name').textContent=p.name; $('pub-title').textContent=p.name; $('pub-sub').textContent=p.sub;
  const lg=$('pub-logo');if(p.logo){lg.src=p.logo;lg.classList.remove('hidden')}else lg.classList.add('hidden');
  $('pub-title').classList.toggle('hidden',!!p.logo);$('pub-sub').classList.toggle('hidden',!!p.logo);
  $('pub-min').textContent=money(p.min); $('pub-insta').textContent=p.insta;
  [['pub-avatar',p.avatar,'pub-avatar-ph'],['pub-cover',p.cover,null],['pv-avatar',p.avatar,null],['pv-cover',p.cover,null],['po-avatar',p.avatar,'po-ph']].forEach(([id,src,ph])=>{
    const el=$(id);if(src){el.src=src;el.classList.remove('hidden')}else{el.removeAttribute('src');el.classList.add('hidden')}
    if(ph)$(ph).classList.toggle('hidden',!!src);
  });
}
function renderGenres(){
  const gs=['Todos',...new Set(S.songs.map(s=>(s.genre||'').trim()).filter(Boolean))];
  if(!gs.includes(genre))genre='Todos';
  $('genres').innerHTML=gs.map(g=>`<button data-g="${esc(g)}" class="shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border ${g===genre?'bg-stone-900 text-white border-stone-900':'bg-white text-stone-700 border-stone-300'}">${esc(g)}</button>`).join('');
  $('genres').querySelectorAll('button').forEach(b=>b.onclick=()=>{genre=b.dataset.g;renderGenres();renderPublic()});
}
function renderPublic(){
  const q=$('search').value.toLowerCase().trim();
  const list=S.songs.filter(s=>(genre==='Todos'||s.genre===genre)&&(!q||(s.title+' '+s.artist).toLowerCase().includes(q)));
  const key=q+'|'+genre;if(key!==lastKey){lim=80;lastKey=key}
  $('pub-list').innerHTML=list.length?list.slice(0,lim).map(s=>`<div class="bg-white p-4 rounded-2xl border border-stone-200 flex items-center justify-between gap-3">
    <div class="min-w-0"><p class="font-semibold truncate">${esc(s.title)}</p><p class="text-xs text-stone-500 truncate">${esc(s.artist)}${s.genre?' • '+esc(s.genre):''}</p></div>
    <button data-id="${esc(s.id)}" class="pedir shrink-0 px-4 py-2 rounded-xl bg-amber-500 text-stone-950 text-xs font-bold">Pedir</button></div>`).join('')+(list.length>lim?`<button id="more" class="col-span-full py-3 rounded-2xl bg-white border border-stone-300 text-sm font-semibold">Ver mais (${list.length-lim})</button>`:''):'<p class="text-sm text-stone-500 col-span-full text-center py-8">Nenhuma música encontrada.</p>';
  $('pub-list').querySelectorAll('.pedir').forEach(b=>b.onclick=()=>openOrder(b.dataset.id));
  const mb=$('more');if(mb)mb.onclick=()=>{lim+=80;renderPublic()};
}
function renderAdmin(){
  const aq=($('ad-search').value||'').toLowerCase().trim();
  const al=S.songs.filter(s=>!aq||(s.title+' '+s.artist).toLowerCase().includes(aq));
  $('ad-list').innerHTML=al.length?al.slice(0,alim).map(s=>`<div class="bg-white p-3 rounded-xl border border-stone-200 flex items-center justify-between gap-2">
    <div class="min-w-0"><p class="text-sm font-semibold truncate">${esc(s.title)}</p><p class="text-xs text-stone-500 truncate">${esc(s.artist)} • ${esc(s.genre||'—')}${s.key?' • Tom '+esc(s.key):''}</p></div>
    <div class="flex gap-1.5 shrink-0"><button data-a="c" data-id="${esc(s.id)}" class="px-2.5 py-1.5 rounded-lg bg-stone-100 text-xs font-semibold">Cifra</button><button data-a="e" data-id="${esc(s.id)}" class="px-2.5 py-1.5 rounded-lg bg-amber-100 text-amber-900 text-xs font-semibold">Editar</button><button data-a="d" data-id="${esc(s.id)}" class="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 text-xs font-semibold">Excluir</button></div></div>`).join('')+(al.length>alim?`<button id="amore" class="w-full py-2.5 rounded-xl bg-stone-100 text-sm font-semibold">Ver mais (${al.length-alim})</button>`:''):'<p class="text-sm text-stone-500">Nenhuma música encontrada.</p>';
  $('ad-list').querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=b.dataset.a;a==='c'?openChords(id):a==='e'?openEditor(id):delSong(id)});
  const am=$('amore');if(am)am.onclick=()=>{alim+=60;renderAdmin()};
}
function fillCfg(){const p=S.p;$('c-name').value=p.name;$('c-sub').value=p.sub;$('c-insta').value=p.insta;$('c-min').value=p.min;$('c-wa').value=p.wa;$('c-key').value=p.key;$('c-pname').value=p.pname;$('c-city').value=p.city}
function readCfg(){const p=S.p;p.name=$('c-name').value.trim()||p.name;p.sub=$('c-sub').value.trim();p.insta=$('c-insta').value.trim();p.min=Math.max(1,parseFloat($('c-min').value)||5);p.wa=$('c-wa').value.replace(/\D/g,'');p.key=$('c-key').value.trim();p.pname=$('c-pname').value.trim();p.city=$('c-city').value.trim()}
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('c-')){readCfg();applyProfile();setDirty();renderPublic()}});

function switchMode(m){
  const a=m==='admin';
  $('view-public').classList.toggle('hidden',a);$('view-admin').classList.toggle('hidden',!a);
  $('t-pub').className=BTN+(a?OFF:ON);$('t-adm').className=BTN+(a?ON:OFF);
}
function subtab(t){
  $('ad-songs').classList.toggle('hidden',t!=='songs');$('ad-set').classList.toggle('hidden',t!=='set');
  $('st-songs').className='px-4 py-2 rounded-xl text-sm font-semibold '+(t==='songs'?'bg-stone-900 text-white':'bg-white border border-stone-300 text-stone-700');
  $('st-set').className='px-4 py-2 rounded-xl text-sm font-semibold '+(t==='set'?'bg-stone-900 text-white':'bg-white border border-stone-300 text-stone-700');
}

/* Músicas */
function openEditor(id){
  const s=S.songs.find(x=>x.id===id)||{};
  $('e-id').value=s.id||'';$('e-title').value=s.title||'';$('e-artist').value=s.artist||'';$('e-genre').value=s.genre||'';$('e-key').value=s.key||'';$('e-chords').value=s.chords||'';
  $('editor-title').textContent=s.id?'Editar Música':'Nova Música';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'});
}
function saveSong(){
  const t=$('e-title').value.trim(),a=$('e-artist').value.trim();
  if(!t||!a){alert('Preencha o nome e o artista.');return}
  const id=$('e-id').value||String(Date.now());
  const o={id,title:t,artist:a,genre:$('e-genre').value.trim(),key:$('e-key').value.trim(),chords:$('e-chords').value};
  const i=S.songs.findIndex(x=>x.id===id);i>=0?S.songs[i]=o:S.songs.push(o);
  $('editor').classList.add('hidden');setDirty();renderAdmin();renderGenres();renderPublic();
}
function delSong(id){if(!confirm('Excluir esta música?'))return;S.songs=S.songs.filter(s=>s.id!==id);setDirty();renderAdmin();renderGenres();renderPublic()}
function openChords(id){
  const s=S.songs.find(x=>x.id===id);if(!s)return;
  $('ch-title').textContent=s.title;$('ch-meta').textContent=s.artist+(s.key?' • Tom '+s.key:'');
  $('ch-body').textContent=s.chords||'(Sem cifra cadastrada)';$('ch-body').style.fontSize=fs+'px';$('modal-chords').classList.remove('hidden');
}
function fontSz(d){fs=Math.min(40,Math.max(10,fs+d));$('ch-body').style.fontSize=fs+'px'}

/* Imagens (redimensionadas e embutidas) */
function upImg(e,kind){
  const f=e.target.files[0];if(!f)return;
  const max=kind==='avatar'?400:1000,r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    S.p[kind]=c.toDataURL('image/jpeg',.75);applyProfile();setDirty();e.target.value='';
  };im.onerror=()=>alert('Não consegui abrir essa imagem. Tente uma foto JPG ou PNG.');im.src=r.result};r.onerror=()=>alert('Não consegui ler o arquivo.');r.readAsDataURL(f);
}
function rmImg(k){S.p[k]='';applyProfile();setDirty()}

/* Pix */
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const F=(i,v)=>i+String(v.length).padStart(2,'0')+v;
const clean=(s,n)=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim().slice(0,n);
function pixPayload(amount){
  const p=S.p;
  const acc=F('00','br.gov.bcb.pix')+F('01',p.key);
  const s=F('00','01')+F('26',acc)+F('52','0000')+F('53','986')+F('54',amount.toFixed(2))+F('58','BR')+F('59',clean(p.pname||p.name,25)||'MUSICO')+F('60',clean(p.city,15)||'BRASIL')+F('62',F('05','***'))+'6304';
  return s+crc(s);
}
function qr(el,text,size){el.innerHTML='';new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}
function openOrder(id){
  const s=S.songs.find(x=>x.id===id);if(!s)return;
  cur=s;$('m-title').textContent=s.title;$('m-artist').textContent=s.artist;
  $('o-name').value='';$('o-note').value='';$('o-amount').value=S.p.min;
  const m=S.p.min;$('quick').innerHTML=[m,m*2,m*4,m*10].map(v=>`<button data-v="${v}" class="flex-1 py-2 rounded-xl bg-amber-100 text-amber-900 text-xs font-bold">${money(v)}</button>`).join('');
  $('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>$('o-amount').value=b.dataset.v);
  $('step-form').classList.remove('hidden');$('step-pix').classList.add('hidden');$('modal-order').classList.remove('hidden');
}
function genPix(){
  const name=$('o-name').value.trim(),amt=parseFloat($('o-amount').value);
  if(!name){alert('Informe seu nome.');return}
  if(!(amt>=S.p.min)){alert('O valor mínimo é '+money(S.p.min));return}
  if(!S.p.key){alert('O músico ainda não cadastrou a chave Pix.');return}
  order={name,amt,note:$('o-note').value.trim()};
  const code=pixPayload(amt);
  $('pix-code').value=code;$('pix-amt').textContent=money(amt);qr($('pix-qr'),code,200);
  $('send-hint').textContent=S.p.wa?'Abre o WhatsApp do músico com seu pedido.':'Mostre esta tela ao músico após pagar.';
  $('step-form').classList.add('hidden');$('step-pix').classList.remove('hidden');
}
function copyPix(){const i=$('pix-code');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}}
function sendOrder(){
  if(!order||!cur)return;
  const msg=`🎵 Pedido: ${cur.title} (${cur.artist})\nDe: ${order.name}\nPix: ${money(order.amt)}${order.note?'\nRecado: '+order.note:''}`;
  if(S.p.wa){window.open('https://wa.me/'+(S.p.wa.length<=11?'55':'')+S.p.wa+'?text='+encodeURIComponent(msg),'_blank')}
  else alert('Pedido registrado! Mostre esta tela ao músico:\n\n'+msg);
  $('modal-order').classList.add('hidden');
}

/* Cartaz */
function openPoster(){
  $('po-name').textContent=S.p.name;$('po-foot').textContent=S.p.insta;
  qr($('po-qr'),location.href.split('#')[0],200);$('modal-poster').classList.remove('hidden');
}

/* Publicar */
async function publishNow(){
  const a=window.claude?await claude.use('artifact'):null;
  if(!a){alert('Publicar só funciona logado no claude.ai, no link do artefato.');return}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  c.querySelectorAll('style:not(#own)').forEach(e=>e.remove());
  ['pub-list','genres','ad-list','quick','pix-qr','po-qr','ch-body'].forEach(i=>c.querySelector('#'+i).innerHTML='');
  ['modal-order','modal-chords','modal-poster','view-admin','editor','tabs'].forEach(i=>c.querySelector('#'+i).classList.add('hidden'));
  c.querySelector('#view-public').classList.remove('hidden');
  try{await a.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){if(e&&e.code!=='conflict')alert('Não consegui publicar: '+(e.message||e.code))}
}

applyProfile();fillCfg();renderGenres();renderPublic();renderAdmin();switchMode('public');subtab('songs');
(async()=>{try{
  if(!window.claude)return;
  const u=await claude.use('user');
  if(u&&((await u.isOwner())||(await u.canEdit()))){$('tabs').classList.remove('hidden')}
}catch(e){}})();
